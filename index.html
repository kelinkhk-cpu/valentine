<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}

.container {
    padding: 30px;
}

h1 {
    font-size: 3rem;
    margin-bottom: 20px;
}

img {
    width: 90%;
    max-width: 600px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,255,255,0.6);
    margin-bottom: 30px;
}

/* 🔥 Stiluri pentru butoane */
button {
    padding: 20px 60px;
    font-size: 28px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin: 20px;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

#yesBtn {
    background: linear-gradient(45deg, #ff1e78, #ff6ec7);
    color: white;
}

#yesBtn:hover {
    transform: scale(1.2);
    box-shadow: 0 15px 35px rgba(255,0,120,0.6);
}

#noBtn {
    background: linear-gradient(45deg, #444, #222);
    color: white;
    position: relative;
}

#videoSection {
    display: none;
    margin-top: 40px;
}

video {
    width: 90%;
    max-width: 700px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<div class="container" id="mainContent">
    <h1>Would you be my Valentine? 💘</h1>
    <img src="valentine.jpg" alt="Valentine Photo">
    <br>
    <!-- 🔥 Butoane noi -->
    <div style="margin-top:30px;">
        <button id="yesBtn">DA 💖</button>
        <button id="noBtn">NU 😢</button>
    </div>
</div>

<div id="videoSection">
    <h1>YEEEEYYYY TE IUBESC MICUTO! &lt;3 💕</h1>
    <video controls autoplay>
        <source src="video.mp4" type="video/mp4">
        Browserul tău nu suportă video.
    </video>
</div>

<!-- 🔥 Script interactiv -->
<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

yesBtn.addEventListener("click", function() {
  document.body.innerHTML = `
  <h1 style="font-size:60px;">YEEEEYYYY TE IUBESC MICUTO! <3 💕</h1>
  <video width="600" controls autoplay>
    <source src="video.mp4" type="video/mp4">
  </video>
  `;
});

noBtn.addEventListener("mouseover", function() {
  const x = Math.random() * (window.innerWidth - 200);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesBtn.style.transform = "scale(1.3)";
});
</script>

</body>
</html>
